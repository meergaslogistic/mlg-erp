<html lang="en">
<head>

    :root {

      --navy-2: #16345a;
      --navy-3: #1c3d66;
      --sidebar: #102a4a;
      --accent: #0d9b6e;
      --accent-2: #0b7d58;
      --accent-soft: #e7f7f1;
      --line: #e6edf5;
      --text: #1b2b3f;
      --muted: #6b7c90;
      --card: #ffffff;
      --bg: #f4f7fb;
      --danger: #c0392b;
      --warn: #d97706;

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {

      color: var(--text);
      min-height: 100vh;

    .app { display: flex; min-height: 100vh; }
    .sidebar {

      background: linear-gradient(180deg, #0d2440 0%, #0b1e36 100%);

      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
      padding: 18px 16px 16px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .logo {
      width: 38px; height: 38px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #3ad39a, #0b6b4a);
      display: grid; place-items: center; font-weight: 800; color: #fff; font-size: 11px;
    }
    .brand h1 { font-size: 13px; color: #fff; line-height: 1.2; font-weight: 700; }
    .brand p { font-size: 9px; letter-spacing: .6px; color: #8fb0d0; text-transform: uppercase; }
    .nav { padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; }
    .nav button {
      background: transparent; border: 0; color: #c5d6e8;
      text-align: left; padding: 10px 12px; border-radius: 10px;
      cursor: pointer; font-size: 13.5px; display: flex; align-items: center; gap: 10px;
    }
    .nav button:hover { background: rgba(255,255,255,.06); }
    .nav button.active { background: #fff; color: var(--navy); font-weight: 600; }
    .nav .ico { width: 16px; text-align: center; opacity: .85; }
    .sidebar-foot {
      margin-top: auto; padding: 14px 16px 18px;
      border-top: 1px solid rgba(255,255,255,.08);
      font-size: 11px; color: #8fb0d0;
    }
    .sidebar-foot strong { color: #fff; display: block; font-size: 12.5px; margin-top: 2px; }
    .chip {
      display: inline-block; margin-top: 8px; background: #0d9b6e; color: #fff;
      font-size: 10px; padding: 3px 8px; border-radius: 6px;
    }
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .topbar {
      height: 64px; background: #fff; border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px;
    }
    .topbar h2 { font-size: 22px; font-weight: 700; }
    .top-right { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; }
    .ghost-btn {
      border: 1px solid var(--line); background: #fff; border-radius: 10px;
      padding: 7px 12px; font-size: 13px; cursor: pointer;
    }
    .content { padding: 20px 24px 32px; overflow: auto; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .card {
      background: #fff; border: 1px solid #e8eef5; border-radius: 16px; padding: 16px 16px 14px;
      box-shadow: 0 1px 0 rgba(16,42,74,.02);
    }
    .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .card-head h3 { font-size: 16px; font-weight: 700; }
    .add-link { color: var(--accent); font-size: 13px; cursor: pointer; font-weight: 600; background: none; border: 0; }
    .pills { display: flex; flex-wrap: wrap; gap: 8px; }
    .pill {
      background: #f3f6fa; border: 1px solid #e6edf4; color: #33465c;
      padding: 6px 11px; border-radius: 999px; font-size: 12.5px;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .pill .x { color: #9aa8b8; cursor: pointer; font-size: 11px; }
    .section-label {
      font-size: 11px; letter-spacing: .8px; color: var(--muted);
      font-weight: 700; margin: 4px 0 12px;
    }
    .mode-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
    .mode {
      border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; cursor: pointer; background: #fff;
    }
    .mode.active { border-color: #7ad1b3; background: #eefaf5; box-shadow: inset 0 0 0 1px #b7e8d4; }
    .mode h4 { font-size: 15px; margin-bottom: 4px; }
    .mode p { font-size: 12.5px; color: var(--muted); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px 16px; }
    .field label { display: block; font-size: 13px; margin-bottom: 6px; font-weight: 600; }
    .field label .req { color: #e11d48; }
    .field input, .field select, .field textarea {
      width: 100%; height: 42px; border: 1px solid #dbe4ee; border-radius: 10px;
      padding: 0 12px; font-size: 13.5px; background: #fff; color: var(--text);
    }
    .field textarea { height: 42px; padding-top: 10px; resize: vertical; }
    .field input:focus, .field select:focus, .field textarea:focus {
      outline: none; border-color: #7ad1b3; box-shadow: 0 0 0 3px rgba(13,155,110,.12);
    }
    .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .dest-card, .loc-card {
      border: 1px solid #e8eef5; border-radius: 14px; padding: 12px; background: #fbfcfe; margin-bottom: 10px;
    }
    .dest-grid { display: grid; grid-template-columns: 1.1fr 1.3fr 1fr 0.8fr 1fr 36px; gap: 10px; align-items: end; }
    .loc-grid { display: grid; grid-template-columns: 1.4fr 1fr 0.8fr 36px; gap: 10px; align-items: end; }
    .icon-btn {
      height: 42px; width: 36px; border: 1px solid #efd2d0; background: #fff5f4; color: var(--danger);

    .primary {

    .note { font-size: 12.5px; color: var(--muted); }
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 10px; flex-wrap: wrap; }
    .toolbar-left, .toolbar-right { display: flex; gap: 8px; align-items: center; }
    .search {

    }
    .btn {

    .btn.red { color: var(--danger); border-color: #f0c7c3; }
    table.data { width: 100%; border-collapse: collapse; font-size: 12px; background: #fff; }
    table.data th {
      text-align: left; background: #fff; color: #111; padding: 8px 7px; font-weight: 700;
      white-space: nowrap; border-bottom: 2px solid #111; font-size: 11.5px;

    table.data td { padding: 7px 7px; border-bottom: 1px solid #ddd; white-space: nowrap; }

    .sheet-wrap { background: #fff; border-radius: 14px; overflow: auto; border: 1px solid var(--line); padding: 8px 8px 12px; }
    .actions a, .actions button {

    .modal-bg {

      align-items: center; justify-content: center; z-index: 50; padding: 20px;
    }
    .modal-bg.show { display: flex; }
    .modal {
      background: #fff; width: min(520px, 100%); border-radius: 16px; padding: 18px;
    }
    .modal h3 { margin-bottom: 12px; }
    .hidden { display: none !important; }
    .alloc { font-size: 12.5px; color: var(--muted); margin: 6px 0 12px; }
    .page-sub { color: var(--muted); font-size: 13px; margin: -8px 0 16px; }
  </style>
</head>

function setMode(m) {
  document.getElementById("modeStock").classList.toggle("active", m==="stock");
  document.getElementById("modeParty").classList.toggle("active", m==="party");
}
function addLocation() {
  locCount++;
  document.getElementById("locs").insertAdjacentHTML("beforeend", locationRow(locCount));
}
function addDestination() {
  destCount++;
  document.getElementById("dests").insertAdjacentHTML("beforeend", destinationRow(destCount));
}
function calcAmount() {
  const q = Number(document.getElementById("loadQty")?.value||0);
  const r = Number(document.getElementById("rate")?.value||0);
  const el = document.getElementById("amount");
  if (el) el.value = r ? money(q*r) : "";
  updateAlloc();
}
function updateAlloc() {
  const loaded = Number(document.getElementById("loadQty")?.value||0);
  let used = 0;
  document.querySelectorAll(".d-qty").forEach(i => used += Number(i.value||0));
  const el = document.getElementById("alloc");
  if (el) el.textContent = `Allocated ${used.toFixed(3)} T of loaded ${loaded.toFixed(3)} T. Leftover stays on route until you add another destination.`;
}
function savePurchase() {
  const brand = document.getElementById("brand").value;
  const bowser = document.getElementById("bowser").value;
  const tradingParty = document.getElementById("tradingParty").value;
  const loadQty = Number(document.getElementById("loadQty").value||0);
  const rate = Number(document.getElementById("rate").value||0);
  const locs = [...document.querySelectorAll(".loc-name")].map(s=>s.value).filter(Boolean);
  if (!brand || !bowser || !tradingParty || !loadQty || !locs.length) {
    alert("Loading Date, Type/Origin of Goods/Brand, Loaded From (Location), Bowser/Vehicle Number, Purchasing Party/Trading Party aur Load Qty required hain.");
    return;
  }
  PURCHASES.unshift({
    no: PURCHASES.length+1,
    loadDate: document.getElementById("loadDate").value || "21-Sep-26",
    brand, unloadDate:"", bowser, party: document.querySelector(".d-dest")?.value || "",
    city: document.querySelector(".d-city")?.value || "",
    plant: document.querySelector(".d-plant")?.value || "",
    unit:"Ton", loadQty, unloadQty: Number(document.querySelector(".d-qty")?.value||loadQty),
    baseRate:"", rate, amount: loadQty*rate, tradingParty, loadedFrom: locs
  });
  page = "purchases";
  render();
}
function editPurchase(i) {
  editingPurchase = PURCHASES[i];
  page = "purchaseForm";
  render();
}
function deletePurchase(i) {
  if (confirm("Delete this purchase entry?")) { PURCHASES.splice(i,1); render(); }
}
function downloadOne(i) {
  const r = PURCHASES[i];
  const csv = toCSV([r]);
  saveFile(`purchase-${r.no}.csv`, csv);
}
function downloadPurchases() {
  saveFile("LPG-PURCHASE-June-2026.csv", toCSV(PURCHASES));
}
function downloadSales() {
  saveFile("LPG-SALE.csv", "No,Date,Type/Origin of Goods/Brand,Bowser/Vehicle Number,Party,City,Loaded From (Location),Qty,Rate,Amount\n" +
    SALES.map(r=>[r.no,r.date,r.brand,r.bowser,r.party,r.city,(r.loadedFrom||[]).join(" + "),r.qty,r.rate,r.amount].join(",")).join("\n"));
}
function toCSV(rows) {
  const header = ["No","Loading Date","LPG/GAS Quality","Unloading Date","Bowser No","Party","City","Filling Plant","Unit","Load Qty","Unload Qty","Base Rate","Rate","Amount (PKR)"];
  const body = rows.map(r => [r.no,r.loadDate,r.brand,r.unloadDate,r.bowser,r.party,r.city,r.plant,r.unit,r.loadQty,r.unloadQty,r.baseRate||"",r.rate,r.amount].join(","));
  return header.join(",") + "\n" + body.join("\n");
}
function saveFile(name, text) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type:"text/csv"}));
  a.download = name; a.click();
}
function filterPurchases() {
  const q = (document.getElementById("q")?.value||"").toLowerCase();
  const rows = PURCHASES.filter(r => JSON.stringify(r).toLowerCase().includes(q));
  document.querySelector("#purchaseTable tbody").innerHTML = purchaseRows(rows);
}
function openModal(key, title) {
  modalTarget = key;
  document.getElementById("modalTitle").textContent = "Add " + title;
  document.getElementById("modalValue").value = "";
  document.getElementById("modal").classList.add("show");
}
function closeModal(){ document.getElementById("modal").classList.remove("show"); }
function saveModal(){
  const val = document.getElementById("modalValue").value.trim();
  if (val) MASTER[modalTarget].push(val);
  closeModal(); render();
}
function removeMaster(key,i){ MASTER[key].splice(i,1); render(); }

render();
</script>
