<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MLG Advanced ERP</title>
  <style>
    :root { --navy:#0f2744; --accent:#0d9b6e; --line:#e6edf5; --text:#1b2b3f; --muted:#6b7c90; --bg:#f4f7fb; --danger:#c0392b; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:Inter,"Segoe UI",system-ui,sans-serif; background:var(--bg); color:var(--text); }
    .app { display:flex; min-height:100vh; }
    .sidebar { width:238px; background:linear-gradient(180deg,#0d2440,#0b1e36); color:#d7e4f2; display:flex; flex-direction:column; flex-shrink:0; }
    .brand { display:flex; align-items:center; gap:10px; padding:14px; border-bottom:1px solid rgba(255,255,255,.08); }
    .brand img { width:46px; height:46px; border-radius:50%; object-fit:cover; background:#fff; }
    .brand h1 { font-size:13px; color:#fff; line-height:1.15; }
    .brand p { font-size:9px; letter-spacing:.5px; color:#8fb0d0; text-transform:uppercase; }
    .nav { padding:10px; display:flex; flex-direction:column; gap:2px; }
    .nav button { background:transparent; border:0; color:#c5d6e8; text-align:left; padding:9px 12px; border-radius:10px; cursor:pointer; font-size:13.2px; }
    .nav button:hover { background:rgba(255,255,255,.06); }
    .nav button.active { background:#fff; color:var(--navy); font-weight:600; }
    .sidebar-foot { margin-top:auto; padding:14px 16px 18px; border-top:1px solid rgba(255,255,255,.08); font-size:11px; color:#8fb0d0; }
    .sidebar-foot strong { color:#fff; display:block; font-size:12.5px; margin-top:2px; }
    .chip { display:inline-block; margin-top:8px; background:#0d9b6e; color:#fff; font-size:10px; padding:3px 8px; border-radius:6px; }
    .main { flex:1; display:flex; flex-direction:column; min-width:0; }
    .topbar { height:64px; background:#fff; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; padding:0 24px; }
    .topbar h2 { font-size:22px; }
    .top-right { display:flex; align-items:center; gap:12px; color:var(--muted); font-size:13px; }
    .ghost-btn,.btn { border:1px solid var(--line); background:#fff; border-radius:10px; padding:7px 12px; font-size:13px; cursor:pointer; height:38px; }
    .btn.green { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
    .content { padding:16px 22px 32px; overflow:auto; }
    .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .card { background:#fff; border:1px solid #e8eef5; border-radius:16px; padding:16px; }
    .card-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
    .add-link { color:var(--accent); font-size:13px; cursor:pointer; font-weight:600; background:none; border:0; }
    .pills { display:flex; flex-wrap:wrap; gap:8px; }
    .pill { background:#f3f6fa; border:1px solid #e6edf4; padding:6px 11px; border-radius:999px; font-size:12.5px; display:inline-flex; gap:6px; }
    .pill .x { color:#9aa8b8; cursor:pointer; }
    .section-label { font-size:11px; letter-spacing:.8px; color:var(--muted); font-weight:700; margin:18px 0 10px; }
    .mode-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .mode { border:1px solid var(--line); border-radius:14px; padding:14px 16px; cursor:pointer; background:#fff; }
    .mode.active { border-color:#7ad1b3; background:#eefaf5; }
    .mode p { font-size:12.5px; color:var(--muted); margin-top:4px; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px 16px; }
    .field label { display:block; font-size:13px; margin-bottom:6px; font-weight:600; }
    .field label .req { color:#e11d48; }
    .field input,.field select { width:100%; height:42px; border:1px solid #dbe4ee; border-radius:10px; padding:0 12px; font-size:13.5px; }
    .hint { font-size:12px; color:var(--muted); margin-top:4px; }
    .dest-card,.loc-card { border:1px solid #e8eef5; border-radius:14px; padding:12px; background:#fbfcfe; margin-bottom:10px; }
    .dest-grid { display:grid; grid-template-columns:1.1fr 1.3fr 1fr .8fr 1fr 36px; gap:10px; align-items:end; }
    .loc-grid { display:grid; grid-template-columns:1.6fr 1fr .8fr 36px; gap:10px; align-items:end; }
    .icon-btn { height:42px; width:36px; border:1px solid #efd2d0; background:#fff5f4; color:var(--danger); border-radius:10px; cursor:pointer; }
    .row-actions { display:flex; justify-content:space-between; align-items:center; margin:6px 0 10px; }
    .primary { background:var(--accent); color:#fff; border:0; border-radius:10px; padding:11px 16px; font-weight:700; cursor:pointer; }
    .note { font-size:12.5px; color:var(--muted); }
    .filters { background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:12px; }
    .filters-top { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
    .filters-grid { display:grid; grid-template-columns:repeat(6,minmax(120px,1fr)); gap:8px; }
    .filters-grid .field label { font-size:11px; color:var(--muted); }
    .filters-grid input,.filters-grid select { height:36px; font-size:12.5px; }
    .stats { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin:0 0 12px; }
    .stat { background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
    .stat b { display:block; font-size:16px; margin-top:2px; }
    .stat span { font-size:11px; color:var(--muted); }
    .sheet-wrap { background:#fff; border-radius:14px; overflow:auto; border:1px solid var(--line); padding:10px; }
    .sheet-logo { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
    .sheet-logo img { width:48px; height:48px; border-radius:50%; object-fit:cover; background:#fff; }
    .co { font-size:12px; color:var(--muted); }
    table.data { width:100%; border-collapse:collapse; font-size:12px; }
    table.data th { text-align:left; padding:8px 7px; font-weight:700; white-space:nowrap; border-bottom:2px solid #111; font-size:11.5px; }
    table.data td { padding:7px; border-bottom:1px solid #ddd; white-space:nowrap; }
    .actions button { background:none; border:0; color:var(--accent); cursor:pointer; font-size:12px; margin-right:8px; font-weight:600; }
    .actions .del { color:var(--danger); }
    .tabs { display:flex; gap:6px; flex-wrap:wrap; margin:0 0 12px; }
    .tab { border:1px solid var(--line); background:#fff; border-radius:999px; padding:6px 12px; cursor:pointer; font-size:12.5px; }
    .tab.active { background:#0d2440; color:#fff; border-color:#0d2440; }
    .cr { color:#0b7d58; font-weight:600; }
    .dr { color:#c0392b; font-weight:600; }
    .modal-bg { position:fixed; inset:0; background:rgba(10,20,35,.45); display:none; align-items:center; justify-content:center; z-index:50; }
    .modal-bg.show { display:flex; }
    .modal { background:#fff; width:min(520px,100%); border-radius:16px; padding:18px; }
    .entry-wrap { background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px 18px 22px; }
    @media (max-width:1200px){ .filters-grid,.form-grid{grid-template-columns:1fr 1fr;} .stats{grid-template-columns:1fr 1fr 1fr;} }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <img src="logo.png" alt="Meer Logistics & Gas Energy" />
      <div><h1>Meer Logistics</h1><p>&amp; Gas Energy</p></div>
    </div>
    <nav class="nav">
      <button data-page="dashboard">Dashboard</button>
      <button data-page="dataflow">Data Flow</button>
      <button data-page="ledgers">Parties &amp; Ledgers</button>
      <button data-page="purchases" class="active">Purchase / Loading</button>
      <button data-page="sales">Sale</button>
      <button data-page="payments">Payments</button>
      <button data-page="masterLedger">Master Ledger</button>
      <button data-page="inventory">Inventory</button>
      <button data-page="diesel">Diesel &amp; Cash</button>
      <button data-page="master">Master Data</button>
    </nav>
    <div class="sidebar-foot">Operations desk<strong>MLG Advanced ERP</strong><span class="chip">Auto Party Ledger</span></div>
  </aside>
  <section class="main">
    <div class="topbar">
      <h2 id="pageTitle">Purchase / Loading</h2>
      <div class="top-right"><button class="ghost-btn">Business Profile</button><span>Mon, 21 Sept 2026</span></div>
    </div>
    <div class="content" id="view"></div>
  </section>
</div>
<div class="modal-bg" id="modal">
  <div class="modal">
    <h3 id="modalTitle">Add item</h3>
    <div class="field" style="margin-bottom:12px"><label>Name</label><input id="modalValue" /></div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn green" onclick="saveModal()">Save</button>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
